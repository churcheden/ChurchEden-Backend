name: backend-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A dedicated Neon Postgres URL (with a non-owner role) used to build the
      # isolated `churcheden_test` schema. The runtime uses @prisma/adapter-neon
      # which can only reach Neon endpoints, so a local postgres service
      # container is not supported. Grant this role CREATE on the database.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare isolated test database
        run: npm run test:setup

      - name: Run test suite
        run: npm test