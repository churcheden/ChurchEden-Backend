name: backend-ci

# CI is currently DISABLED. The automated tests and typecheck reference the
# previous Prisma models (User/Admin/ChurchMembership/Transaction) and will not
# pass against the new schema (SuperAdmin/Member/ChurchTransaction). Re-enable
# the run triggers below (pull_request/push) once the test suite is updated to
# the corrected schema.
#
# For now this workflow can still be executed manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare isolated test database
        run: npm run test:setup
        env:
          # Scoped to this step only. The setup script appends
          # ?schema=churcheden_test and writes the final URL to .env.test.
          # It must NOT leak into the test step — custom-env does not
          # override existing env vars, so a stale DATABASE_URL would
          # cause Prisma to connect to the wrong schema.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run test suite
        run: npm test