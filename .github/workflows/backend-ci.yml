name: backend-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare isolated test database
        run: npm run test:setup
        env:
          # Scoped to this step only. The setup script appends
          # ?schema=churcheden_test and writes the final URL to .env.test.
          # It must NOT leak into the test step — custom-env does not
          # override existing env vars, so a stale DATABASE_URL would
          # cause Prisma to connect to the wrong schema.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run test suite
        run: npm test